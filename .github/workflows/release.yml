name: Release

on:
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: Publish Python package to PyPI
        required: true
        type: boolean
        default: false
      publish_npm:
        description: Publish TypeScript package to npm
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python -m pip install build
      - run: python -m build --outdir python-dist
      - run: npm ci
      - run: npm test
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            python-dist/
            *.tgz

  publish-pypi:
    needs: build
    if: inputs.publish_pypi
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-dist/

  publish-npm:
    needs: build
    if: inputs.publish_npm
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
      - run: npm publish *.tgz --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
